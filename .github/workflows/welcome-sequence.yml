name: Welcome sequence

on:
  schedule:
    - cron: '17 * * * *' # Hourly
  workflow_dispatch:

jobs:
  welcome:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN:   ${{ secrets.TURSO_AUTH_TOKEN }}
      RESEND_API_KEY:     ${{ secrets.RESEND_API_KEY }}
      NEWSLETTER_FROM_EMAIL: ${{ secrets.NEWSLETTER_FROM_EMAIL }}
      NEWSLETTER_UNSUBSCRIBE_SECRET: ${{ secrets.NEWSLETTER_UNSUBSCRIBE_SECRET }}
      NEXT_PUBLIC_BASE_URL: https://dividendvisual.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Send due welcome emails
        run: python scripts/send_welcome_sequence.py
